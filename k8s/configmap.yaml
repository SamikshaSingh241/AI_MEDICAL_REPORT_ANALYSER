apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: medisense-ai
  labels:
    app.kubernetes.io/name: medisense-backend
data:
  NODE_ENV: "production"
  PORT: "5000"
  MONGODB_URI: "mongodb://admin:password123@mongodb-headless.medisense-ai.svc.cluster.local:27017/medisense?authSource=admin"
  CORS_ORIGIN: "https://medisense.example.com,http://localhost"
